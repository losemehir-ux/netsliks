
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE">
    <title>Netsliks - Movie Database</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #000; flex-wrap: wrap; }
        .imdb-logo { font-size: 24px; font-weight: bold; background: #f5c518; color: black; padding: 5px 10px; cursor: pointer; }
        .search-bar { flex-grow: 1; margin: 0 20px; }
        .search-bar input { width: 100%; padding: 10px; border-radius: 5px; border: none; }
        .movies-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 20px; }
        .movie-card { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; }
        .movie-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        .movie-title { font-size: 16px; margin: 10px 0; display: block; color: white; text-decoration: none; }
        .card-btn { background: #333; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
        @media screen and (max-width: 768px) {
            header { flex-direction: column; text-align: center; }
            .search-bar { width: 100%; margin: 10px 0; }
            .movies-container { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .movie-card img { height: 180px; }
        }
    </style>
</head>
<body>
<header>
    <div class="imdb-logo">IMDb</div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="Search 100 Movies & Series..."></div>
</header>
<h2 style="padding: 20px;">All 100 Curated Masterpieces</h2>
<div class="movies-container" id="movieGrid"></div>
<script>
    const moviesData = [
        { id: 1, title: "Mr. Robot", poster: "https://m.media-amazon.com/images/M/MV5BMjA1OTU5Nzc4NV5BMl5BanBnXkFtZTgwNTI4MDYxNjE@._V1_SX300.jpg" }
    ];
    function displayMovies(items) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = "";
        items.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `<img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Poster'"><span class="movie-title">${movie.title}</span><button class="card-btn">Details</button>`;
            grid.appendChild(card);
        });
    }
    displayMovies(moviesData);
</script>
</body>
