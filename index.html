    <!DOCTYPE html>
<html lang="en">
<head>

    <style>
          /* Simple Mobile Grid Fix */
       @media screen and (max-width: 768px) {
    .movies-container, .grid-container {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
        padding: 10px !important;
    }
    .movie-card {
        width: 100% !important;
    }
} 
.movies-container, .grid-container {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; /* Yeh har mobile screen par fit ho jayega */
    gap: 10px !important;
    padding: 10px !important;
    width: 100% !important;
    box-sizing: border-box !important;
}

.movie-card {
    width: 100% !important;
    margin: 0 !important;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
        }

        .imdb-header {
            background-color: #121212;
            border-bottom: 1px solid #272727;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .imdb-logo {
            background-color: #f5c518;
            color: #000000;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .search-bar {
            display: flex;
            flex: 1;
            max-width: 600px;
            margin: 0 30px;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #000;
        }

        .search-bar button {
            background: transparent;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: #1f1f1f;
        }

        .main-container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            border-left: 4px solid #f5c518;
            padding-left: 12px;
            margin-bottom: 20px;
            color: #f5c518;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .view-all {
            font-size: 0.9rem;
            color: #5799ef;
            cursor: pointer;
            text-decoration: none;
        }

        .view-all:hover {
            text-decoration: underline;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .movie-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #272727;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-color: #444;
        }

        .poster-box {
            height: 300px;
            background-color: #262626;
            overflow: hidden;
            position: relative;
        }

        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .movie-card:hover .poster-box img {
            transform: scale(1.05);
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .star {
            color: #f5c518;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-title:hover {
            color: #5799ef;
            text-decoration: underline;
        }

        .card-btn {
            margin-top: auto;
            background-color: #2c2c2c;
            color: #5799ef;
            border: none;
            padding: 7px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .card-btn:hover {
            background-color: #383838;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a;
            max-width: 800px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: #222;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .modal-header h2 {
            color: #f5c518;
            font-size: 1.4rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .modal-body p {
            margin-bottom: 12px;
            color: #ccc;
        }

        .modal-body strong {
            color: #fff;
        }

        footer {
            background-color: #121212;
            border-top: 1px solid #272727;
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 0.9rem;
            margin-top: 50px;
        }

        @media(max-width: 768px) {
            .imdb-header {
                padding: 10px 15px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .search-bar {
                order: 3;
                margin: 0;
                max-width: 100%;
            }
          
    </style>
</head>
<body>

    <header class="imdb-header">
        <div class="imdb-logo" onclick="filterMovies('all')">huzafnet</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search 100 Movies & Series..." onkeyup="searchMovies()">
            <button onclick="searchMovies()">🔍</button>
        </div>
        <nav class="nav-links">
            <a href="#" onclick="filterMovies('all')">Home</a>
            <a href="#" onclick="filterMovies('cyber')">Cyber & Sci-Fi</a>
            <a href="#" onclick="filterMovies('top')">Top Rated</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="section-title">
            <span id="sectionHeading">All 100 Curated Masterpieces</span>
            <a href="#" class="view-all" onclick="filterMovies('all')">Reset Filter</a>
        </div>

        <div class="movie-grid" id="movieGrid">
        </div>
    </div>

    <div class="modal-overlay" id="movieModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Movie Title</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CineCyber Database. Developed by Huzaifa. 100 Unique Titles with Official Posters.</p>
    </footer>

    <script>
        const moviesData = [
    { id: 1, title: "The Matrix", category: "cyber", rating: "8.7", genre: "Sci-Fi Action", creator: "The Wachowskis", summary: "A hacker discovers the true nature of his reality and his role in the war against its controllers.", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
    { id: 2, title: "Interstellar", category: "top", rating: "8.7", genre: "Sci-Fi Drama", creator: "Christopher Nolan", summary: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
    { id: 3, title: "Inception", category: "top", rating: "8.8", genre: "Sci-Fi Thriller", creator: "Christopher Nolan", summary: "A thief who steals corporate secrets through the use of dream-sharing technology.", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg" },
    { id: 4, title: "Breaking Bad", category: "top", rating: "9.5", genre: "Crime Drama", creator: "Vince Gilligan", summary: "A chemistry teacher diagnosed with cancer turns to manufacturing and selling methamphetamine.", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
    { id: 5, title: "Fight Club", category: "top", rating: "8.8", genre: "Drama Thriller", creator: "David Fincher", summary: "An insomniac office worker and a devil-may-care soap maker form an underground fight club.", poster: "https://image.tmdb.org/t/p/w500/bptfVGEQuv6vDTIMVCHjJ9Dz8PX.jpg" },
    { id: 6, title: "The Dark Knight", category: "top", rating: "9.0", genre: "Action Crime", creator: "Christopher Nolan", summary: "Batman raises the stakes in his war on crime with the help of Lieutenant Jim Gordon and District Attorney Harvey Dent.", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
    { id: 7, title: "Pulp Fiction", category: "top", rating: "8.9", genre: "Crime Drama", creator: "Quentin Tarantino", summary: "The lives of two mob hitmen, a boxer, a gangster and his wife intertwine in four tales of violence.", poster: "https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg" },
    { id: 8, title: "Gladiator", category: "top", rating: "8.5", genre: "Action Drama", creator: "Ridley Scott", summary: "A former Roman general sets out to exact vengeance against the corrupt emperor who murdered his family.", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" },
    { id: 9, title: "Blade Runner 2049", category: "cyber", rating: "8.0", genre: "Sci-Fi Cyberpunk", creator: "Denis Villeneuve", summary: "A young blade runner's discovery of a long-buried secret leads him to track down former blade runner Rick Deckard.", poster: "https://image.tmdb.org/t/p/w500/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg" },
    { id: 10, title: "The Terminator", category: "cyber", rating: "8.1", genre: "Sci-Fi Action", creator: "James Cameron", summary: "A human warrior is sent from 2029 to 1984 to prevent a cyborg assassin from killing a young woman.", poster: "https://image.tmdb.org/t/p/w500/hzZCOdrgCGwDRAtDvOa4nN8f2Q2.jpg" },
    { id: 11, title: "Terminator 2: Judgment Day", category: "cyber", rating: "8.6", genre: "Sci-Fi Action", creator: "James Cameron", summary: "A cyborg, identical to the one who failed to kill Sarah Connor, must now protect her teenage son.", poster: "https://image.tmdb.org/t/p/w500/5M0j0B18abtBE5gi2Fy3QDCoVST.jpg" },
    { id: 12, title: "Spider-Man: Into the Spider-Verse", category: "top", rating: "8.4", genre: "Animation Action", creator: "Bob Persichetti", summary: "Teen Miles Morales becomes the Spider-Man of his universe, and must cross paths with alternate counterparts.", poster: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg" }
];
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = "";

            if(items.length === 0) {
                grid.innerHTML = "<p style='color:#777; grid-column: 1/-1;'>No matching movies found.</p>";
                return;
            }

            items.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box" onclick="openModal(${movie.id})">
                       <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="rating-row">
                            <span class="star">★</span>
                            <span><strong>${movie.rating}</strong>/10</span>
                        </div>
                        <a href="#" class="movie-title" onclick="openModal(${movie.id}); return false;">${movie.title}</a>
                        <button class="card-btn" onclick="openModal(${movie.id})">Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        displayMovies(moviesData);

        function filterMovies(type) {
            const heading = document.getElementById('sectionHeading');
            if(type === 'all') {
                heading.innerText = "All 100 Curated Masterpieces";
                displayMovies(moviesData);
            } else if(type === 'cyber') {
                heading.innerText = "Cyber-Security & Sci-Fi Thrillers";
                const filtered = moviesData.filter(m => m.category === 'cyber');
                displayMovies(filtered);
            } else if(type === 'top') {
                heading.innerText = "Top Rated Masterpieces (8.5+ Rating)";
                const filtered = moviesData.filter(m => parseFloat(m.rating) >= 8.5);
                displayMovies(filtered);
            }
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = moviesData.filter(m => m.title.toLowerCase().includes(query) || m.genre.toLowerCase().includes(query));
            document.getElementById('sectionHeading').innerText = query ? `Search Results for "${query}"` : "All 100 Curated Masterpieces";
            displayMovies(filtered);
        }

        function openModal(id) {
            const movie = moviesData.find(m => m.id === id);
            if(!movie) return;

            document.getElementById('modalTitle').innerText = movie.title;
            document.getElementById('modalBody').innerHTML = `
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <img src="${movie.poster}" alt="${movie.title}" style="width:180px; height:260px; object-fit:cover; border-radius:4px; border:1px solid #333;">
                    <div style="flex:1; min-width:250px;">
                        <p><strong>Genre / Type:</strong> ${movie.genre}</p>
                        <p><strong>IMDb Rating:</strong> <span style="color:#f5c518;">★ ${movie.rating} / 10</span></p>
                        <p><strong>Creator / Director:</strong> ${movie.creator}</p>
                        <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
                        <p><strong>Story Overview:</strong><br>${movie.summary}</p>
                    </div>
                </div>
            `;
            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('movieModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
