<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCyber huzaafsnet - 100 Ultimate Masterpieces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #141414;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo {
            background-color: #f5c518;
            color: #000;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 1.2rem;
        }
        .main-container {
            padding: 30px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-left: 4px solid #f5c518;
            padding-left: 10px;
        }
        .section-header h2 {
            font-size: 1.5rem;
            color: #f5c518;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }
        .poster-box {
            width: 100%;
            height: 300px;
            background-color: #222;
            cursor: pointer;
            overflow: hidden;
        }
        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .rating-row {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 5px;
        }
        .star {
            color: #f5c518;
            margin-right: 5px;
        }
        .movie-title {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-btn {
            background-color: #222;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .card-btn:hover {
            background-color: #f5c518;
            color: #000;
        }
        .rating-section {
            background-color: #141414;
            padding: 30px;
            border-radius: 8px;
            margin-top: 50px;
            border: 1px solid #222;
            text-align: center;
        }
        .rating-section h3 {
            color: #f5c518;
            margin-bottom: 15px;
        }
        .stars-container {
            font-size: 2rem;
            cursor: pointer;
            color: #555;
            margin-bottom: 15px;
        }
        .stars-container .selected {
            color: #f5c518;
        }
        .rating-section textarea {
            width: 100%;
            max-width: 600px;
            height: 100px;
            padding: 10px;
            border-radius: 4px;
            border: none;
            background-color: #222;
            color: #fff;
            margin-bottom: 15px;
            resize: none;
        }
        .submit-rating-btn {
            background-color: #f5c518;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .submit-rating-btn:hover {
            background-color: #e5b510;
        }
        footer {
            background-color: #141414;
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">huzafnet</div>
    </header>

    <div class="main-container">
        <div class="section-header">
            <h2>Curated Masterpieces</h2>
        </div>
        
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Cards -->
        </div>

        <div class="rating-section">
            <h3>Your feedback matters to us—help us improve with your rating!</h3>
            <div class="stars-container" id="starContainer">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
            <textarea id="feedbackText" placeholder="Write your feedback here..."></textarea>
            <br>
            <button class="submit-rating-btn" onclick="submitRating()">Submit Rating</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CineCyber Database. Developed by Huzaifa.</p>
    </footer>

    <script>
        const moviesData = [
            { id: 1, title: "The Matrix", rating: "8.7", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
            { id: 2, title: "Interstellar", rating: "8.7", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
            { id: 3, title: "Inception", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg" },
            { id: 4, title: "Breaking Bad", rating: "9.5", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
            { id: 5, title: "Fight Club", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/bptfVGEQuv6vDTIMVCHjJ9Dz8PX.jpg" },
            { id: 6, title: "The Dark Knight", rating: "9.0", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
            { id: 7, title: "Pulp Fiction", rating: "8.9", poster: "https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg" },
            { id: 8, title: "Gladiator", rating: "8.5", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" },
            { id: 9, title: "Blade Runner 2049", rating: "8.0", poster: "https://image.tmdb.org/t/p/w500/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg" },
            { id: 10, title: "Spider-Man: Into the Spider-Verse", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg" },
            { id: 11, title: "Avatar", rating: "7.9", poster: "https://image.tmdb.org/t/p/w500/kyeShkV8swvHmiw8rK3bZc3xP4z.jpg" },
            { id: 12, title: "Avengers: Endgame", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
            { id: 13, title: "Joker", rating: "8.4", poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg" },
            { id: 14, title: "Parasite", rating: "8.5", poster: "https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg" },
            { id: 15, title: "The Lord of the Rings: The Fellowship of the Ring", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg" }
        ];

        let selectedRating = 0;
        const stars = document.querySelectorAll('#starContainer span');

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = this.getAttribute('data-value');
                stars.forEach(s => {
                    if(s.getAttribute('data-value') <= selectedRating) {
                        s.classList.add('selected');
                    } else {
                        s.classList.remove('selected');
                    }
                });
            });
        });

        // Exact Google Sheet Web App URL integrated
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbffmE_rXta78txzMDw7GLKbaXfeZa0aG08lJw0Ba2CPJKqludcLjucfULCn7DZ5kt/exec';

        function submitRating() {
            const feedback = document.getElementById('feedbackText').value;
            const submitBtn = document.querySelector('.submit-rating-btn');

            if (selectedRating === 0) {
                alert("Please select at least 1 star before submitting!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const data = {
                rating: selectedRating,
                feedback: feedback
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert(`Thank you for rating our website ${selectedRating} stars! ❤️`);
                selectedRating = 0;
                document.getElementById('feedbackText').value = "";
                stars.forEach(s => s.classList.remove('selected'));
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Rating";
            })
            .catch(error => {
                console.error('Error!', error);
                alert("Something went wrong. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Rating";
            });
        }

        const grid = document.getElementById('movieGrid');
        if (grid) {
            grid.innerHTML = "";
            moviesData.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info">
                        <div class="rating-row">
                            <span class="star">★</span>
                            <span><strong>${movie.rating}</strong>/10</span>
                        </div>
                        <a href="#" class="movie-title">${movie.title}</a>
                        <button class="card-btn">Details</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
