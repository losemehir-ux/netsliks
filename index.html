<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="">
    <title>CineCyber - 100 Ultimate Masterpieces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #141414;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo {
            background-color: #f5c518;
            color: #000;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 1.2rem;
        }
        .search-bar input {
            padding: 8px 15px;
            width: 300px;
            border-radius: 4px;
            border: none;
            background-color: #222;
            color: #fff;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
        }
        nav a:hover {
            color: #f5c518;
        }
        .main-container {
            padding: 30px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-left: 4px solid #f5c518;
            padding-left: 10px;
        }
        .section-header h2 {
            font-size: 1.5rem;
            color: #f5c518;
        }
        .reset-filter {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .reset-filter:hover {
            color: #fff;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }
        .poster-box {
            width: 100%;
            height: 300px;
            background-color: #222;
            cursor: pointer;
            overflow: hidden;
        }
        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .rating-row {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 5px;
        }
        .star {
            color: #f5c518;
            margin-right: 5px;
        }
        .movie-title {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .movie-title:hover {
            color: #f5c518;
        }
        .card-btn {
            background-color: #222;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .card-btn:hover {
            background-color: #f5c518;
            color: #000;
        }
        footer {
            background-color: #141414;
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">huzafnet</div>
        <div class="search-bar">
            <input type="text" placeholder="Search 100 Movies & Series...">
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Cyber & Sci-Fi</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="section-header">
            <h2>All 12 Curated Masterpieces</h2>
            <a href="#" class="reset-filter">Reset Filter</a>
        </div>
        
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Cards will load here -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CineCyber Database. Developed by Huzaifa. Official Working Posters.</p>
    </footer>

    <script>
        const moviesData = [
            { id: 1, title: "The Matrix", category: "cyber", rating: "8.7", genre: "Sci-Fi Action", creator: "The Wachowskis", summary: "A hacker discovers the true nature of his reality and his role in the war against its controllers.", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
            { id: 2, title: "Interstellar", category: "top", rating: "8.7", genre: "Sci-Fi Drama", creator: "Christopher Nolan", summary: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
            { id: 3, title: "Inception", category: "top", rating: "8.8", genre: "Sci-Fi Thriller", creator: "Christopher Nolan", summary: "A thief who steals corporate secrets through the use of dream-sharing technology.", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg" },
            { id: 4, title: "Breaking Bad", category: "top", rating: "9.5", genre: "Crime Drama", creator: "Vince Gilligan", summary: "A chemistry teacher diagnosed with cancer turns to manufacturing and selling methamphetamine.", poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" },
            { id: 5, title: "Fight Club", category: "top", rating: "8.8", genre: "Drama Thriller", creator: "David Fincher", summary: "An insomniac office worker and a devil-may-care soap maker form an underground fight club.", poster: "https://image.tmdb.org/t/p/w500/bptfVGEQuv6vDTIMVCHjJ9Dz8PX.jpg" },
            { id: 6, title: "The Dark Knight", category: "top", rating: "9.0", genre: "Action Crime", creator: "Christopher Nolan", summary: "Batman raises the stakes in his war on crime with the help of Lieutenant Jim Gordon and District Attorney Harvey Dent.", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
            { id: 7, title: "Pulp Fiction", category: "top", rating: "8.9", genre: "Crime Drama", creator: "Quentin Tarantino", summary: "The lives of two mob hitmen, a boxer, a gangster and his wife intertwine in four tales of violence.", poster: "https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg" },
            { id: 8, title: "Gladiator", category: "top", rating: "8.5", genre: "Action Drama", creator: "Ridley Scott", summary: "A former Roman general sets out to exact vengeance against the corrupt emperor who murdered his family.", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" },
            { id: 9, title: "Blade Runner 2049", category: "cyber", rating: "8.0", genre: "Sci-Fi Cyberpunk", creator: "Denis Villeneuve", summary: "A young blade runner's discovery of a long-buried secret leads him to track down former blade runner Rick Deckard.", poster: "https://image.tmdb.org/t/p/w500/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg" },
            { id: 10, title: "The Terminator", category: "cyber", rating: "8.1", genre: "Sci-Fi Action", creator: "James Cameron", summary: "A human warrior is sent from 2029 to 1984 to prevent a cyborg assassin from killing a young woman.", poster: "https://image.tmdb.org/t/p/w500/hzZCOdrgCGwDRAtDvOa4nN8f2Q2.jpg" },
            { id: 11, title: "Terminator 2: Judgment Day", category: "cyber", rating: "8.6", genre: "Sci-Fi Action", creator: "James Cameron", summary: "A cyborg, identical to the one who failed to kill Sarah Connor, must now protect her teenage son.", poster: "https://image.tmdb.org/t/p/w500/5M0j0B18abtBE5gi2Fy3QDCoVST.jpg" },
            { id: 12, title: "Spider-Man: Into the Spider-Verse", category: "top", rating: "8.4", genre: "Animation Action", creator: "Bob Persichetti", summary: "Teen Miles Morales becomes the Spider-Man of his universe, and must cross paths with alternate counterparts.", poster: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg" }
        ];

        function openModal(id) {
            const movie = moviesData.find(m => m.id === id);
            if(movie) {
                alert(movie.title + "\n\n" + movie.summary + "\n\nRating: " + movie.rating + "/10");
            }
        }

        const grid = document.getElementById('movieGrid');
        if (grid) {
            grid.innerHTML = "";
            const items = moviesData;

            if (items.length === 0) {
                grid.innerHTML = "<p style='color:#777; grid-column: 1/-1;'>No matching movies found.</p>";
            } else {
                items.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <div class="poster-box" onclick="openModal(${movie.id})">
                            <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                        </div>
                        <div class="movie-info">
                            <div class="rating-row">
                                <span class="star">★</span>
                                <span><strong>${movie.rating}</strong>/10</span>
                            </div>
                            <a href="#" class="movie-title" onclick="openModal(${movie.id}); return false;">${movie.title}</a>
                            <button class="card-btn" onclick="openModal(${movie.id})">Details</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
